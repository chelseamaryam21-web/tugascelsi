<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tugas</title>
    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        button {
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <h1>Daftar Tugas - P6_060</h1>
    <input type="text" id="inputTugas" placeholder="Masukkan tugas">
    <button onclick="tambahTugas()">Tambah Tugas</button>
    <button onclick="tampilkanTugas()">Tampilkan Daftar Tugas</button>
    <ul id="listTugas" style="display: none;"></ul>

    <script>
        // Array untuk menyimpan daftar tugas
        let daftarTugas = [];

        // Fungsi untuk menambahkan tugas
        function tambahTugas() {
            const input = document.getElementById('inputTugas');
            const teks = input.value.trim();
            if (teks) {
                daftarTugas.push({ text: teks, completed: false });
                input.value = '';
            } else {
                alert('Silakan masukkan tugas.');
            }
        }

        // Fungsi untuk menampilkan daftar tugas
        function tampilkanTugas() {
            const list = document.getElementById('listTugas');
            list.innerHTML = ''; // Membersihkan daftar sebelum ditampilkan

            if (daftarTugas.length === 0) {
                list.innerHTML = '<li>Tidak ada tugas.</li>'; // Menampilkan pesan jika tidak ada tugas
            } else {
                daftarTugas.forEach((tugas, index) => {
                    // Membuat elemen list untuk setiap tugas
                    const li = document.createElement('li');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = tugas.completed; // Menentukan apakah checkbox dicentang atau tidak
                    checkbox.onchange = () => tandaiSelesai(index); // Menambahkan fungsi tandai selesai pada checkbox

                    const span = document.createElement('span');
                    span.textContent = tugas.text; // Menampilkan teks tugas
                    if (tugas.completed) {
                        span.classList.add('completed'); // Menandai tugas selesai
                    }

                    const btnHapus = document.createElement('button');
                    btnHapus.textContent = 'Hapus';
                    btnHapus.style.marginLeft = '10px'; // Menambahkan margin kiri langsung pada tombol
                    btnHapus.onclick = () => hapusTugas(index); // Menambahkan fungsi hapus pada tombol

                    li.appendChild(checkbox); // Menambahkan checkbox ke elemen li
                    li.appendChild(span); // Menambahkan teks tugas ke elemen li
                    li.appendChild(btnHapus); // Menambahkan tombol hapus ke elemen li

                    list.appendChild(li); // Menambahkan tugas ke daftar
                });
            }

            // Tampilkan daftar hanya saat tombol ditekan
            list.style.display = 'block';
        }

        // Fungsi untuk menandai tugas sebagai selesai atau belum selesai
        function tandaiSelesai(index) {
            daftarTugas[index].completed = !daftarTugas[index].completed;
            tampilkanTugas(); // Memperbarui tampilan setelah perubahan status
        }

        // Fungsi untuk menghapus tugas
        function hapusTugas(index) {
            daftarTugas.splice(index, 1);
            tampilkanTugas();
        }
    </script>
</body>

</html>
