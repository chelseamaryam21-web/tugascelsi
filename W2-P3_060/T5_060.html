<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warna Latar Acak</title>
</head>

<body>
    <h1>Pengubah Warna Latar Belakang - T5_060</h1>
    <button id="btnWarna">Ubah Warna</button>

    <script>
        function warnaAcak() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r}, ${g}, ${b})`;
        }

        document.getElementById('btnWarna').addEventListener('click', () => {
            document.body.style.backgroundColor = warnaAcak();
        });
    </script>
</body>

</html>
