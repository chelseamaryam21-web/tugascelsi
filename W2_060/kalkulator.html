<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1_057</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f95e9c;      
        }

        .container {
            text-align: center;
        }
         
    </style>
</head>
<body>
    <div class="container">
        <h1>Kalkulator</h1>
        <button onclick="MulaiKalkulator()">Mulai Kalkulator</button>

        <div id="hasil"></div>
    </div>
    <script>
        function MulaiKalkulator(){
            const input = prompt("Masukkan operasi (contoh: 2+3, 4-1, 5*6, 10/2):");
            if (!input) {
                alert("Operasi dibatalkan!");
                return;
            }
            const match = input.match(/^(\d+)([\+\-\*\/])(\d+)$/);
               if (!match) {
                   alert("Format operasi tidak valid! Pastikan menggunakan format seperti 2+3, 4-1, 5*6, atau 10/2.");
                   return;
            }
               const angka1 = parseFloat(match[1]); 
               const operasi = match[2];
               const angka2 = parseFloat(match[3]);
                let hasil;

                switch (operasi) {
                    case '+':
                        hasil = angka1 + angka2;
                        break;
                    case '-':
                        hasil = angka1 - angka2;
                        break;
                    case '*':
                        hasil = angka1 * angka2;
                        break;
                    case '/':
                        if (angka2 === 0) {
                            alert("Error: Pembagian dengan nol tidak diperbolehkan!");
                            return;
                        }
                        hasil = angka1 / angka2;
                        break;
                    default:
                        alert("Operasi tidak valid! Gunakan +, -, *, atau /.");
                        return;
                }
                alert(`Hasil: ${hasil}`);
        }
    </script>
</body>
</html>
